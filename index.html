<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FLUODEX</title>
    <style>
        :root {
            --bg-desk: #081709;
            --panel-face: #172b1b;
            --panel-dark: #061709;
            --panel-light: #376741;
            --border-hi: #4d7554;
            --border-lo: #000500;
            --folder-inactive: #102012;
            --folder-active: #172b1b;
            --text-main: #faf4d6;
            --text-dim: #a3b49f;
            --gold: #ffe360;
            --gold-glow: #ffe360;
            --font-display: "Times New Roman", Times, Georgia, serif;
            --font-ui: Tahoma, "MS Sans Serif", Verdana, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-ui);
            background-color: var(--bg-desk);
            background-image:
                linear-gradient(45deg, rgba(0, 0, 0, 0.22) 25%, transparent 25%),
                linear-gradient(-45deg, rgba(0, 0, 0, 0.22) 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, rgba(0, 0, 0, 0.22) 75%),
                linear-gradient(-45deg, transparent 75%, rgba(0, 0, 0, 0.22) 75%);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0;
            color: var(--text-main);
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }


        .bevel-out {
            background: var(--panel-face);
            border-top: 2px solid var(--border-hi);
            border-left: 2px solid var(--border-hi);
            border-right: 2px solid var(--border-lo);
            border-bottom: 2px solid var(--border-lo);
        }

        .zoom-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
            overflow: hidden;
            user-select: none;
        }

        .zoom-overlay.open {
            display: flex;
        }

        .zoom-overlay img {
            height: 85vh;
            width: auto;
            max-width: none;
            max-height: none;
            image-rendering: pixelated;
            border: 2px solid var(--border-hi);
            box-shadow: 0 0 30px #000;
            cursor: grab;
            transform-origin: center center;
        }

        .zoom-overlay img:active {
            cursor: grabbing;
        }

        .zoom-hint {
            position: fixed;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--panel-dark);
            border: 1px solid var(--border-hi);
            color: var(--gold);
            font-size: 0.8rem;
            padding: 5px 12px;
            pointer-events: none;
        }

        .bevel-in {
            background: var(--panel-dark);
            border-top: 2px solid var(--border-lo);
            border-left: 2px solid var(--border-lo);
            border-right: 2px solid var(--border-hi);
            border-bottom: 2px solid var(--border-hi);
        }

        input[type="range"] {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            background: transparent;
            cursor: pointer;
            height: 20px;
            margin: 0;
        }

        input[type="range"]:focus {
            outline: 1px dotted var(--gold);
        }


        input[type="range"]::-webkit-slider-runnable-track {
            height: 8px;
            background: #0d130c;
            border: 2px inset #4a522d;
            border-radius: 0;
        }


        input[type="range"]::-moz-range-track {
            height: 8px;
            background: #0d130c;
            border: 2px inset #4a522d;
            border-radius: 0;
        }


        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 18px;
            background: #ca8a04;
            border: 2px outset #eab308;
            border-radius: 0;
            margin-top: -7px;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            background: #eab308;
        }

        input[type="range"]::-webkit-slider-thumb:active {
            border-style: inset;
        }


        input[type="range"]::-moz-range-thumb {
            width: 12px;
            height: 18px;
            background: #ca8a04;
            border: 2px outset #eab308;
            border-radius: 0;
            box-sizing: border-box;
        }

        input[type="range"]::-moz-range-thumb:hover {
            background: #eab308;
        }

        input[type="range"]::-moz-range-thumb:active {
            border-style: inset;
        }

        select.sort-select,
        select.filter-dropdown {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            border-radius: 0;
            cursor: pointer;
            padding-right: 28px;
            background-color: var(--panel-dark);
            background-image:
                url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='22' height='22' viewBox='0 0 22 22'><rect x='0' y='0' width='22' height='22' fill='%23172b1b'/><line x1='0' y1='0' x2='0' y2='22' stroke='%234a522d' stroke-width='2'/><line x1='2' y1='1' x2='21' y2='1' stroke='%234d7554' stroke-width='2'/><line x1='21' y1='0' x2='21' y2='22' stroke='%23000500' stroke-width='2'/><line x1='0' y1='21' x2='22' y2='21' stroke='%23000500' stroke-width='2'/><polygon points='7,9 15,9 11,14' fill='%23facc15'/></svg>");
            background-repeat: no-repeat;
            background-position: right 0 center;
            background-size: 22px 100%;
        }

        select.sort-select:focus,
        select.filter-dropdown:focus {
            outline: 1px dotted var(--gold);
        }

        select.sort-select option,
        select.filter-dropdown option {
            background: var(--panel-dark);
            color: var(--text-main);
        }


        .left-rail {
            width: 148px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            z-index: 2;
        }

        .logo-area {
            padding: 0px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--panel-dark);
            border-bottom: 2px solid var(--border-lo);
        }

        .site-logo {
            max-width: 100%;
            max-height: 100%;
            width: 100%;
            height: 100%;
			object-fit: fill;
            display: block;
            image-rendering: pixelated;
        }

        .ver-header {
            padding: 8px 6px;
            font-family: var(--font-display);
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-align: center;
            background: var(--panel-face);
            border-top: 2px solid var(--border-hi);
            border-bottom: 2px solid var(--border-lo);
            text-shadow: 4px 4px 0 #000;
        }


        .version-list {
            flex: 1;
            overflow-y: auto;
            padding: 6px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .ver-btn {
            font-family: var(--font-display);
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text-main);
            padding: 10px 6px;
            cursor: pointer;
            text-align: center;
            text-shadow: 2px 2px 0 #000;
            background: var(--panel-face);
            border-top: 2px solid var(--border-hi);
            border-left: 2px solid var(--border-hi);
            border-right: 2px solid var(--border-lo);
            border-bottom: 2px solid var(--border-lo);
        }

        .ver-btn:hover {
            background: var(--panel-light);
            color: var(--gold);
        }

        .ver-btn.active {
            background: var(--panel-dark);
            color: var(--gold-glow);
            border-top: 2px solid var(--border-lo);
            border-left: 2px solid var(--border-lo);
            border-right: 2px solid var(--border-hi);
            border-bottom: 2px solid var(--border-hi);
        }


        .center-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            min-width: 0;
            padding: 8px 10px 0;
        }

        .count-row {
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-bottom: 6px;
            padding-left: 4px;
            text-shadow: 2px 2px 0 #000;
        }

        .count-row strong {
            color: var(--gold);
        }

        .folder-tabs-row {
            display: flex;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 2px;
            padding-left: 4px;
            position: relative;
            z-index: 3;
        }

        .folder-tab-wrap {
            filter: drop-shadow(0 -1px 0 var(--border-hi)) drop-shadow(1px 0 0 var(--border-lo));
        }

        .folder-tab {
            font-family: var(--font-ui);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            color: var(--text-dim);
            background: var(--folder-inactive);
            border: none;
            padding: 8px 20px 7px;
            cursor: pointer;
            clip-path: polygon(10px 0%, calc(100% - 10px) 0%, 100% 100%, 0% 100%);
            text-shadow: 2px 2px 0 #000;
            transition: background 0.1s, color 0.1s;
        }

        .folder-tab:hover {
            background: var(--panel-light);
            color: var(--text-main);
        }

        .folder-tab.active {
            background: var(--folder-active);
            color: var(--gold);
            padding-top: 10px;
            padding-bottom: 9px;
            margin-bottom: -2px;
        }


        .folder-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--folder-active);
            border-top: 2px solid var(--border-hi);
            border-left: 2px solid var(--border-hi);
            border-right: 2px solid var(--border-lo);
            overflow: hidden;
            position: relative;
            z-index: 2;
        }

        .search-sort-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            padding: 10px 14px;
            border-bottom: 2px groove var(--border-hi);
        }

        .search-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 200px;
        }

        .search-group label {
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.05em;
        }

        .search-input {
            flex: 1;
            max-width: 340px;
            padding: 5px 8px;
            color: var(--text-main);
            font-family: var(--font-ui);
            font-size: 0.85rem;
        }

        .search-input:focus {
            outline: 1px dotted var(--gold);
        }

        .sort-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .sort-select {
            padding: 5px 8px;
            color: var(--text-main);
            font-family: var(--font-ui);
            font-size: 0.82rem;
        }

        .grid-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            background: #041507;
            box-shadow: inset 0 3px 10px rgba(0, 0, 0, 0.65);
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(172px, 1fr));
            gap: 14px;
        }

        .card-tile {
            aspect-ratio: 5 / 7;
            cursor: pointer;
            padding: 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: var(--panel-face);
            border-top: 2px solid var(--border-hi);
            border-left: 2px solid var(--border-hi);
            border-right: 2px solid var(--border-lo);
            border-bottom: 2px solid var(--border-lo);
        }

        .card-tile:hover {
            outline: 2px dashed var(--gold);
            outline-offset: -4px;
        }

        .card-tile img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }


        .right-rail {
            width: 265px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            z-index: 2;
        }

        .filters-header {
            padding: 12px 14px;
            font-family: var(--font-display);
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-align: center;
            background: var(--panel-dark);
            border-bottom: 2px solid var(--border-lo);
            text-shadow: 4px 4px 0 #000;
        }

        .filters-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 12px 12px 28px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .filter-box {
            padding: 10px;
        }

        .filter-title {
            font-family: var(--font-display);
            font-size: 0.98rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 4px;
            color: var(--gold);
            text-shadow: 3px 3px 0 #000;
        }

        .range-readout {
            text-align: center;
            font-size: 0.78rem;
            color: var(--gold-glow);
            font-weight: 700;
            margin-bottom: 6px;
        }

        .slider-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.72rem;
            color: var(--text-dim);
            margin-bottom: 4px;
        }

        .slider-row input[type="range"] {
            flex: 1;
        }

        .filter-dropdown {
            width: 100%;
            padding: 5px 6px;
            color: var(--text-main);
            font-family: var(--font-ui);
            font-size: 0.82rem;
        }

        .retro-btn {
            width: 100%;
            padding: 8px;
            font-family: var(--font-ui);
            font-weight: 700;
            font-size: 0.82rem;
            letter-spacing: 0.04em;
            color: var(--text-main);
            cursor: pointer;
            text-shadow: 2px 2px 0 #000;
        }

        .retro-btn:active {
            border-top: 2px solid var(--border-lo);
            border-left: 2px solid var(--border-lo);
            border-right: 2px solid var(--border-hi);
            border-bottom: 2px solid var(--border-hi);
        }


        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.82);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 100;
        }

        .modal-backdrop.open {
            display: flex;
        }

        .modal-window {
            max-width: 1020px;
            width: 100%;
            overflow: hidden;
        }

        .win95-titlebar {
            background: linear-gradient(90deg, #172b1b, #061709);
            padding: 6px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-lo);
        }

        .win95-titlebar strong {
            font-family: var(--font-display);
            font-size: 1.5rem;
            letter-spacing: 0.03em;
            text-shadow: 3px 3px 0 #000;
        }

        .win95-close {
            width: 24px;
            height: 22px;
            font-weight: 900;
            cursor: pointer;
            color: var(--text-main);
        }

        .wiki-tabbar {
            display: flex;
            flex-wrap: wrap;
            background: var(--panel-dark);
            padding: 6px 8px 0;
            gap: 3px;
            border-bottom: 1px solid var(--border-hi);
        }

        .wiki-tab {
            font-family: var(--font-ui);
            font-size: 0.8rem;
            font-weight: 700;
            padding: 6px 14px;
            cursor: pointer;
            color: var(--text-dim);
            background: var(--folder-inactive);
			text-shadow: 3px 3px 0 #000;
            border: none;
            clip-path: polygon(8px 0%, calc(100% - 8px) 0%, 100% 100%, 0% 100%);
        }

.wiki-tab.active {
  background: var(--panel-face);
  color: var(--gold);
  padding-top: 8px;
  padding-bottom: 8px;
  margin-top: -2px;
  margin-bottom: -2px;
  position: relative;
  z-index: 2;
  box-shadow: inset 0 2px 0 var(--border-hi);
}


 .modal-content {
  display: grid;
  grid-template-columns: 420px 1fr;
  align-items: stretch;
  gap: 18px;
  padding: 18px;
}

#modalTable {
  width: 100%;
  height: 100%;
  border-collapse: collapse;
}

#modalTable td {
  padding: 9px 12px;
  border: 1px solid var(--border-lo);
  background: var(--panel-dark);
  font-family: "Times New Roman", Times, Georgia, serif;
  font-size: 1.05rem;
  text-shadow: 2px 2px 0 #000;
}

#modalTable td:first-child {
  color: var(--gold);
  width: 38%;
  font-weight: 700;
  background: #0f1d11;
}

#modalTable tr.desc-row {
  height: 100%;
}

#modalTable tr.desc-row td {
  vertical-align: top;
  padding-top: 10px;
  padding-bottom: 10px;
}

.info-desc-box {
  height: 100%;
  min-height: 120px;
  overflow-y: auto;
  white-space: pre-wrap;
  line-height: 1.45;
}


		/* Custom 90s Beveled Scrollbars */
::-webkit-scrollbar {
  width: 14px;
  height: 14px;
}

::-webkit-scrollbar-track {
  background: #000d00;
  border-left: 1px solid #2a3c24;
  box-shadow: inset 1px 1px 0 #050904;
}

::-webkit-scrollbar-thumb {
  background: #18301c;
  border-top: 2px solid #4a724b;
  border-left: 2px solid #4a724b;
  border-right: 2px solid #000e01;
  border-bottom: 2px solid #000e01;
}

::-webkit-scrollbar-thumb:hover {
  background: #334d2c;
  border-top-color: #d4af37;
  border-left-color: #d4af37;
}

::-webkit-scrollbar-corner {
  background: #000d00;
}
        @media (max-width: 820px) {
            body {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
                overflow-x: hidden;
                overflow-y: auto;
            }

            /* 1. Top compact header + horizontal version strip */
            .left-rail {
                width: 100%;
                height: auto;
                flex-direction: row;
                flex-wrap: wrap;
                align-items: center;
                border-bottom: 2px solid var(--border-lo);
            }
            .logo-area {
                width: 120px;
                height: 54px;
                border-bottom: none;
                border-right: 2px solid var(--border-lo);
            }
            .ver-header {
                display: none;
            }
            .version-list {
                flex: 1;
                flex-direction: row;
                overflow-x: auto;
                overflow-y: hidden;
                padding: 6px;
                gap: 6px;
            }
            .ver-btn {
                font-size: 1rem;
                padding: 6px 12px;
                white-space: nowrap;
                flex-shrink: 0;
            }

            /* 2. Full-width center binder with horizontal-scrolling folder tabs */
            .center-area {
                height: auto;
                padding: 8px 6px 0;
            }
            .folder-tabs-row {
                flex-wrap: nowrap;
                overflow-x: auto;
                padding-bottom: 2px;
                -webkit-overflow-scrolling: touch;
            }
            .folder-tab-wrap {
                flex-shrink: 0;
            }
            .folder-tab {
                padding: 7px 14px 6px;
                font-size: 0.74rem;
            }
            .folder-body {
                overflow: visible;
            }
            .search-sort-bar {
                padding: 8px 10px;
                gap: 8px;
            }
            .search-group, .sort-group {
                width: 100%;
                min-width: 0;
            }
            .search-input {
                max-width: none;
            }
            .grid-scroll {
                overflow-y: visible;
                padding: 10px;
            }
            .card-grid {
                grid-template-columns: repeat(auto-fill, minmax(115px, 1fr));
                gap: 8px;
            }
            .card-tile {
                padding: 5px;
            }

            /* 3. Full-width filters below grid */
            .right-rail {
                width: 100%;
                height: auto;
                margin-top: 10px;
            }
            .filters-scroll {
                overflow-y: visible;
            }

            /* 4. Stacked single-column card modal */
            .modal-backdrop {
                padding: 10px;
                align-items: flex-start;
                overflow-y: auto;
            }
            .modal-window {
                margin: auto 0;
                max-height: 92vh;
                overflow-y: auto;
            }
            .modal-content {
                grid-template-columns: 1fr;
                padding: 12px;
                gap: 12px;
            }
            #modalArtBox {
                max-width: 240px;
                margin: 0 auto;
                width: 100%;
            }
            #modalTable td {
                padding: 7px 9px;
                font-size: 0.95rem;
            }
        }
        /* Shave off black TTS sheet corners across grid, modal, and zoom overlay */
        .card-thumb img,
        #modalArtBox img,
        #zoomImg {
            border-radius: 6.5% / 4.8%;
            overflow: hidden;
        }
               #modalArtBox {
            align-self: start;
        }
        #modalTable {
            display: block;
            max-height: 588px;
            overflow-y: auto;
            overflow-x: hidden;
        }
        #modalTable tbody {
            display: table;
            width: 100%;
        }
                 .sub-tab-chip {
            display: inline-block;
            position: relative;
            top: -2px;
            margin: -4px 0 -4px 6px;
            padding: 0 2px;
            font-size: 16px;
            line-height: 0.8;
            color: #a3b49f;
            background: transparent;
            border: none;
            box-shadow: none;
            text-shadow: 2px 2px 0 #000;
            cursor: pointer;
            vertical-align: middle;
        }
        .sub-tab-chip:hover {
            color: #b8aa68;
            transform: scale(1.12);
        }
        .sub-tab-chip.active {
            color: #ffd84d;
           text-shadow: 2px 2px 0 #000;
        }
        /* Rainbow prism text & star for LEGENDARY MONSTERS */
               /* Static diagonal prism rainbow for LEGENDARY MONSTERS & star */
        .tab-rainbow-active,
        .sub-tab-chip.rainbow-active,
        .sub-tab-chip.active.rainbow-active {
            background: linear-gradient(
                115deg,
                #ff4757 0%,
                #ffa502 22%,
                #ffeb3b 42%,
                #2ed573 62%,
                #1e90ff 82%,
                #b84dff 100%
            ) !important;
            background-size: 100% 100% !important;
            -webkit-background-clip: text !important;
            background-clip: text !important;
            color: transparent !important;
            -webkit-text-fill-color: transparent !important;
            text-shadow: none !important;
            filter: drop-shadow(2px 2px 0 #000);
        }
      

    </style>
</head>

<body>


    <aside class="left-rail bevel-out">
        <div class="logo-area">
            <img src="logo.png" alt="FLUODEX" class="site-logo" />
        </div>
        <div class="ver-header">VER. SELECT</div>
        <div class="version-list" id="versionList"></div>

            // Rotation logic (modal + zoom lightbox)
            let zoomScale = 1, zoomPanX = 0, zoomPanY = 0, isZoomDragging = false, zoomStartX = 0, zoomStartY = 0;

            function applyModalRotation() {
                const img = artBox.querySelector("img");
                if (!img) return;
                img.style.transition = "none";
                if (modalRotation % 180 !== 0) {
                    const ratio = (img.naturalWidth && img.naturalHeight) ? (img.naturalWidth / img.naturalHeight) : 0.71;
                    img.style.transform = "rotate(" + modalRotation + "deg) scale(" + ratio.toFixed(3) + ")";
                } else {
                    img.style.transform = "rotate(" + modalRotation + "deg)";
                }
            }

            function applyZoomTransform() {
                const base = "translate(" + zoomPanX + "px, " + zoomPanY + "px) scale(" + zoomScale + ")";
                zoomImg.style.transform = modalRotation ? (base + " rotate(" + modalRotation + "deg)") : base;
            }

            function stepRotation(e) {
                if (e) e.stopPropagation();
                modalRotation = (modalRotation + 90) % 360;
                applyModalRotation();
                if (zoomOverlay.classList.contains("open")) {
                    applyZoomTransform();
                }
            }

            modalRotBtn.addEventListener("click", stepRotation);

            artBox.addEventListener("click", function () {
                const img = this.querySelector("img");
                if (!img || !img.src) return;
                zoomImg.src = img.src;
                zoomScale = 1;
                zoomPanX = 0;
                zoomPanY = 0;
                applyZoomTransform();
                zoomOverlay.classList.add("open");
            });

            zoomOverlay.addEventListener("wheel", function (e) {
                e.preventDefault();
                const delta = e.deltaY < 0 ? 0.25 : -0.25;
                zoomScale = Math.min(Math.max(0.5, zoomScale + delta), 5);
                applyZoomTransform();
            }, { passive: false });

            zoomImg.addEventListener("mousedown", function (e) {
                e.preventDefault();
                isZoomDragging = true;
                zoomStartX = e.clientX - zoomPanX;
                zoomStartY = e.clientY - zoomPanY;
            });

            window.addEventListener("mousemove", function (e) {
                if (!isZoomDragging) return;
                zoomPanX = e.clientX - zoomStartX;
                zoomPanY = e.clientY - zoomStartY;
                applyZoomTransform();
            });

            window.addEventListener("mouseup", function () {
                isZoomDragging = false;
            });

            zoomOverlay.addEventListener("click", function (e) {
                if (e.target === zoomOverlay) zoomOverlay.classList.remove("open");

            // Global keyboard shortcuts (Ctrl+E Edit Mode, R Rotate, ESC Close)

                        isEditingModal = false;
                        if (currentModalCard && currentModalVer) openModal(currentModalCard, currentModalVer);

                if (e.key === "Escape") {
                    if (zoomOverlay.classList.contains("open")) {
                        zoomOverlay.classList.remove("open");
                    } else {
                        document.getElementById("modalBackdrop").classList.remove("open");
                    }
                    return;
                }

                const backdrop = document.getElementById("modalBackdrop");
                const isOpen = (backdrop && backdrop.classList.contains("open")) || zoomOverlay.classList.contains("open");
                if (!isOpen) return;
                if (["INPUT", "TEXTAREA", "SELECT"].indexOf(document.activeElement.tagName) !== -1) return;
                if (e.key.toLowerCase() === "r" && !e.ctrlKey && !e.metaKey) {
                    e.preventDefault();

            function downloadFile(filename, content, mime) {

           function buildVersionButtons(versions) {
    const versionList = document.getElementById("versionList");
    if (!versionList) return;

    const verOnly = versions.filter(function (v) { return v !== "ALL" && v !== "1.8.3"; });

        const nb = parseFloat(b);
        if (!isNaN(na) && !isNaN(nb) && na !== nb) return nb - na;
        return String(b).localeCompare(String(a), undefined, { numeric: true });
    });

    if (verOnly.length && verOnly.indexOf(state.version) === -1) {
        state.version = verOnly.slice(0, 1).join("");
    }

    verOnly.forEach(function (ver) {
        const btn = document.createElement("button");
        btn.className = "ver-btn" + (ver === state.version ? " active" : "");
        btn.textContent = ver;
        btn.onclick = function () {
            document.querySelectorAll(".ver-btn").forEach(function (b) { b.classList.remove("active"); });
            btn.classList.add("active");
            state.version = ver;
            render();
        };
        versionList.appendChild(btn);
    });
}


            function fillSelect(id, values) {
                const sel = document.getElementById(id);
                if (!sel) return;
                const prevVal = sel.value;
                while (sel.options.length > 1) sel.remove(1);
                [...new Set(values.filter(Boolean))].sort().forEach(function (v) {
                    sel.add(new Option(v, v));
                });
                if ([...sel.options].some(function (o) { return o.value === prevVal; })) {

                }

           function compareVersions(a, b) {
    const sa = String(a || "").trim().toUpperCase();
    const sb = String(b || "").trim().toUpperCase();
    if (sa === sb) return 0;

    const betaA = sa.indexOf("BETA") !== -1;
    const betaB = sb.indexOf("BETA") !== -1;

    const partsA = sa.replace(/[^0-9.]/g, "").split(".").filter(Boolean).map(Number);
    const partsB = sb.replace(/[^0-9.]/g, "").split(".").filter(Boolean).map(Number);
    const len = Math.max(partsA.length, partsB.length);

    for (let i = 0; i < len; i++) {
        const numA = partsA[i] || 0;
        const numB = partsB[i] || 0;
        if (numA !== numB) return numA - numB;
    }

    if (betaA !== betaB) return betaA ? -1 : 1;
    return sa.localeCompare(sb, undefined, { numeric: true });
}

function render() {
    document.body.classList.toggle("theme-legendary", state.subFilter === "LEGENDARY");
    let list = new Array();
    CARDS.forEach(function (c) {
        const versions = (c.versions || new Array()).slice().sort(function (a, b) {
            return compareVersions(a.version, b.version);
        });
        if (!versions.length) return;

        if (state.version === "ALL" || state.version === "LATEST") {
            list.push({ card: c, ver: versions[versions.length - 1] });
        } else {
            const eligible = versions.filter(function (x) {
                return compareVersions(x.version, state.version) <= 0;
            });

            if (eligible.length) {
                list.push({ card: c, ver: eligible[eligible.length - 1] });
            }
        }
    });
    document.getElementById("totCount").textContent = list.length;


                const mbhMinLimit = Number(document.getElementById("mbhMin").min);
                const mbhMaxLimit = Number(document.getElementById("mbhMax").max);
                const atkMinLimit = Number(document.getElementById("atkMin").min);
                const atkMaxLimit = Number(document.getElementById("atkMax").max);
                const stageMinLimit = Number(document.getElementById("stageMin").min);
                const stageMaxLimit = Number(document.getElementById("stageMax").max);

                list = list.filter(function (item) {
                    const card = item.card;
                    const ver = item.ver;

            const rawTypes = (ver.type || "").toUpperCase().split(/[,/|]+/).map(function (s) { return s.trim(); });
        const hasDiscTag = rawTypes.includes("DISCONTINUED");
        const isDiscontinuedNow = card.discontinued_in
            ? compareVersions(state.version, card.discontinued_in) >= 0
            : hasDiscTag;

        const isLegendary = rawTypes.some(function (t) { return t === "LEGENDARY" || t.split(/\s+/).includes("LEGENDARY"); });
        const isSuperVip = rawTypes.some(function (t) { return t === "SUPER VIP" || t === "SUPER" || t.split(/\s+/).includes("SUPER"); });

        if (state.type.toUpperCase() === "DISCONTINUED") {
            if (!isDiscontinuedNow) return false;
        } else {
            if (isDiscontinuedNow) return false;
            const tabKey = state.type.toUpperCase().replace(/S$/, "");
            if (tabKey !== "ALL") {
                const matchesBase = rawTypes.some(function (t) { return t.replace(/S$/, "") === tabKey; });
                const matchesSub = (tabKey === "MONSTER" && isLegendary) || (tabKey === "VIP" && isSuperVip);
                if (!matchesBase && !matchesSub) return false;
            }
        }

        const tabKey = state.type.toUpperCase().replace(/S$/, "");
        if (tabKey === "MONSTER") {
            if (state.subFilter === "LEGENDARY" ? !isLegendary : isLegendary) return false;
        }
        if (tabKey === "VIP") {
            if (state.subFilter === "SUPER" ? !isSuperVip : isSuperVip) return false;
        }


                    if (state.search) {
                        const hay = (
                            (ver.name || "") + " " +
                            (ver.notes || "") + " " +
                            (ver.archetypes || []).join(" ") + " " +
                            (ver.tags || "")
                        ).toLowerCase();
                        if (!hay.includes(state.search)) return false;
                    }

                    if (state.debut !== "ALL" && card.debut !== state.debut) return false;
                    if (state.archetype !== "ALL" && !(ver.archetypes || []).includes(state.archetype)) return false;
                    if (state.creator !== "ALL" && (ver.creator || ver.composer) !== state.creator) return false;
                    if (state.series !== "ALL" && ver.original_series !== state.series) return false;
                    if (state.nationality !== "ALL" && !(ver.nationalities || []).includes(state.nationality)) return false;

                    if (state.mbhMin > mbhMinLimit || state.mbhMax < mbhMaxLimit) {
                        if (ver.mbh === null || ver.mbh === undefined || ver.mbh < state.mbhMin || ver.mbh > state.mbhMax) {
                            return false;
                        }
                    }

                    if (state.atkMin > atkMinLimit || state.atkMax < atkMaxLimit) {
                        const atk = ver.base_attack ?? ver.base_atk;
                        const minAtkVal = ATK_STEPS[state.atkMin] ?? 0;
                        const maxAtkVal = ATK_STEPS[state.atkMax] ?? 999;
                        if (atk === null || atk === undefined || atk < minAtkVal || atk > maxAtkVal) {
                            return false;
                        }
                    }

                    if (state.stageMin > stageMinLimit || state.stageMax < stageMaxLimit) {
                        const minVal = STAGE_STEPS[state.stageMin] ?? 4;
                        const maxVal = STAGE_STEPS[state.stageMax] ?? 999;
                        const rawLen = ver.stage_length;
                        const numLen = (rawLen === "Infinite" || rawLen === "∞" || rawLen === Infinity) ? 999 : Number(rawLen);
                        if (rawLen === null || rawLen === undefined || rawLen === "" || isNaN(numLen) || numLen < minVal || numLen > maxVal) {
                            return false;
                        }
                    }

                    return true;
                });

                // Anchor numbered sets (e.g., JOH1..JOH6) to their "1" card's name
                const setAnchorName = {};
                list.forEach(function (item) {
                    const m = (item.card.id || "").match(/^(.+?)(\d+)$/);
                    if (m) {
                        const prefix = m[1];
                        const num = Number(m[2]);
                        if (!setAnchorName[prefix] || num < setAnchorName[prefix].num) {
                            setAnchorName[prefix] = { num: num, name: item.ver.name || "" };
                        }
                    }
                });

                list.sort(function (a, b) {
                    const atkA = a.ver.base_attack ?? a.ver.base_atk ?? -1;
                    const atkB = b.ver.base_attack ?? b.ver.base_atk ?? -1;
                    if (state.sort === "mbh_desc") return (b.ver.mbh ?? -1) - (a.ver.mbh ?? -1);
                    if (state.sort === "atk_desc") return atkB - atkA;
                    if (state.sort === "stage_desc") return (b.ver.stage_length ?? -1) - (a.ver.stage_length ?? -1);
                    if (state.sort === "debut_asc") return (a.card.debut || "").localeCompare(b.card.debut || "");
                    if (state.sort === "versions_desc") return (b.card.versions || []).length - (a.card.versions || []).length;

                    const idA = a.card.id || "";
                    const idB = b.card.id || "";
                    const mA = idA.match(/^(.+?)(\d+)$/);
                    const mB = idB.match(/^(.+?)(\d+)$/);

                    const sortNameA = mA ? setAnchorName[mA[1]].name : (a.ver.name || "");
                    const sortNameB = mB ? setAnchorName[mB[1]].name : (b.ver.name || "");

                    const nameCmp = sortNameA.localeCompare(sortNameB, undefined, { numeric: true });
                    if (nameCmp !== 0) return nameCmp;

                    if (mA && mB && mA[1] === mB[1]) {
                        return idA.localeCompare(idB, undefined, { numeric: true });
                    }
                    return (a.ver.name || "").localeCompare(b.ver.name || "", undefined, { numeric: true });
                });

                document.getElementById("visCount").textContent = list.length;
                const grid = document.getElementById("cardGrid");
                grid.innerHTML = "";
                list.forEach(function (item) {
                    const card = item.card;
                    const ver = item.ver;
                    const tile = document.createElement("div");
                    tile.className = "card-tile";
                  if (ver.image) {
    const img = document.createElement("img");
    img.loading = "lazy";
    img.decoding = "async";
    img.alt = ver.name || "";
    img.src = ver.image;
    tile.appendChild(img);
}
else {
                        const top = document.createElement("div");
                        top.style.cssText = "font-size:0.72rem; color:#4ade80; font-weight:700; border-bottom:1px solid #061709; padding-bottom:4px;";
                        top.textContent = (ver.type || "") + " · " + (ver.version || "");

                        const mid = document.createElement("div");
                        mid.style.cssText = "font-family:var(--font-display); font-size:1.15rem; font-weight:700; text-align:center; text-shadow:2px 2px 0 #000;";
                        mid.textContent = ver.name || "";

                        const bot = document.createElement("div");
                        bot.style.cssText = "font-size:0.76rem; color:#a9baa5; text-align:center; border-top:1px solid #061709; padding-top:4px;";
                        bot.textContent = (ver.hp !== null && ver.hp !== undefined) ? (ver.hp + " HP (" + ver.mbh + " MBH)") : "Special Card";

                        tile.append(top, mid, bot);
                    }
                    tile.onclick = function () { openModal(card, ver); };
                    grid.appendChild(tile);
                });
            }

            // Initialize UI and load cards.json once
            buildVersionButtons(DEFAULT_VERSIONS);
            syncEditorVisibility();

            fetch("cards.json?v=" + Date.now())
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    CARDS = Array.isArray(data) ? data : (data.cards || []);
                    const saved = localStorage.getItem(STORAGE_KEY);
                    if (saved) {
                        try {
                            const parsed = JSON.parse(saved);
                            if (Array.isArray(parsed) && parsed.length) {
                                CARDS = parsed;
                            }
                        } catch (e) {}
                    }
                    refreshControlsFromData();
                    render();
                });
        })();
		
    </script>
</body>

</html>
